# Development template. Replace paneldomain.com and the filesystem path before use.
# Install this HTTP server block, then run:
#   sudo certbot --nginx --redirect -d YOUR_REAL_DOMAIN
# Certbot will add the HTTPS listener and certificate paths.
server {
    listen 80;
    listen [::]:80;
    server_name paneldomain.com;

    root /var/www/owntv-custom/server/public;
    index index.php;
    charset utf-8;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(\.env|composer\.(json|lock)|artisan|database/|storage/|bootstrap/cache/) {
        deny all;
    }
}
